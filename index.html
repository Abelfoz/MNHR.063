<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Система</title>
<style>
*{box-sizing:border-box}
:root{--bg:#050505;--pn:#0c0c0c;--ln:#3b3b3b;--tx:#cfcfcf;--dm:#7d7d7d;--ac:#9a6bff}
html,body{height:100%;margin:0;overflow:hidden;font:13px "Courier New",Consolas,monospace;color:var(--tx);user-select:none;background:var(--bg)}
#desktop{position:fixed;inset:0 0 28px 0;background:
linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,
linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,var(--bg)}

.win{position:absolute;display:none;flex-direction:column;background:var(--pn);border:1px solid var(--ln);box-shadow:0 0 0 1px #000,6px 6px 0 rgba(0,0,0,.6);min-width:280px}
